<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Socials | Kiarra Oyao</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #000000, #1a1a1a);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
    }

    h1 {
      color: #ffdb58;
      margin-bottom: 40px;
      font-size: 2.5rem;
      letter-spacing: 1px;
    }

    .social-links {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      margin-bottom: 60px;
      width: 100%;
      max-width: 400px;
    }

    .social-links a {
      background-color: #1a1a1a;
      padding: 15px 25px;
      border-radius: 10px;
      width: 100%;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 15px;
      text-decoration: none;
      color: #ffdb58;
      font-size: 1.3rem;
      box-shadow: 0 4px 10px rgba(255, 219, 88, 0.2);
      transition: all 0.3s ease;
    }

    .social-links a:hover {
      background-color: #ffdb58;
      color: #000;
      transform: scale(1.03);
    }

    .icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      object-fit: cover;
    }

    .return-button {
      margin-top: auto;
      padding: 12px 30px;
      background-color: #ffdb58;
      color: #000;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1rem;
      transition: background-color 0.3s ease;
    }

    .return-button:hover {
      background-color: #e6c84e;
    }

    footer {
      margin-top: 40px;
      color: #888;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <h1>Connect with Me</h1>

  <div class="social-links">
    <a href="https://www.facebook.com/kiarra.oyao.03" target="_blank">
      <img src="socpics/facebookpic" alt="Facebook" class="icon"> Facebook
    </a>
    <a href="https://www.instagram.com/rxutxnx/" target="_blank">
      <img src="socpics/instapic" alt="Instagram" class="icon"> Instagram
    </a>
    <a href="https://www.tiktok.com/@acelle_oyao" target="_blank">
      <img src="socpics/tiktokpic.jpg" alt="TikTok" class="icon"> TikTok
    </a>
  </div>

  <footer>
    <a href="index.html" class="return-button">Return</a>
  </footer>

</body>
</html>
