<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hobbies | Kiarra Oyao</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #000;
      color: white;
      text-align: center;
      padding: 50px 20px;
    }

    h1 {
      color: #ffdb58;
      margin-bottom: 30px;
    }

    .hobby-images {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

    .hobby-images img {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    .return-button {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #ffdb58;
      color: black;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
      transition: background 0.3s;
    }

    .return-button:hover {
      background-color: #e6c84e;
    }

    footer {
      margin-top: 50px;
      font-size: 0.9rem;
      color: #888;
    }
  </style>
</head>
<body>

  <h1>My Hobbies</h1>

  <div class="hobby-images">
    <img src="hobbiespic/badminton.jpg" alt="Hobby 1">
    <img src="hobbiespic/codm.jpg" alt="Hobby 2">
    <img src="hobbiespic/taekwondo.jpg" alt="Hobby 3">
  </div>


  <footer>
    <a href="index.html" class="return-button">Return</a>
  </footer>

</body>
</html>
