<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Me | Kiarra Oyao Portfolio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #000;
      color: white;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 2.2rem;
      color: #ffdb58;
    }

    form {
      width: 100%;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.05);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-size: 1rem;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      margin-bottom: 20px;
      background: #222;
      color: white;
      font-size: 1rem;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button {
      background: #ffdb58;
      color: black;
      padding: 10px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #ffbf00;
      transform: scale(1.05);
    }

    .back-link {
      margin-top: 30px;
      text-decoration: none;
      color: #ffdb58;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .back-link:hover {
      color: #ffbf00;
    }
  </style>
</head>
<body>

  <h1>Contact Me</h1>

  <form>
    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Your name" required />

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Your email" required />

    <label for="message">Message</label>
    <textarea id="message" placeholder="Currently Not Available" required></textarea>

    <button type="submit">Send Message</button>
  </form>

  <a href="index.html" class="back-link">← Back to Portfolio</a>

</body>
</html>
